[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PIE", "RUF"]
# Odoo idioms that are not defects:
# B018  - __manifest__.py is a bare dict literal
# RUF012 - class-level mutable attributes are the ORM's declaration style
ignore = ["B018", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# addon __init__ files import submodules for their side effects
"**/__init__.py" = ["F401"]
